[package]
name = "ring-lab"
version = "0.1.0"
edition = "2021"

[dependencies]
pingora-ketama = { git = "https://github.com/cloudflare/pingora", rev = "623e163dfab9685c4a49bab08ed78838dd366ba6", features = ["v2"] }
crc32fast = "1.3"
rand = "0.9"
rand_chacha = "0.9"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dhat = "0.3"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "build_lookup"
harness = false

[profile.release]
debug = true
